name: Build & Test

on:
  push:
    branches: [main, rust-port]
    tags: ['v*']          # Tag v1.2.3 pushen -> Release mit Programmen
  pull_request:
  release:
    types: [published]    # in der GitHub-Oberfläche veröffentlichter Release -> Programme anhängen
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Feste Rust-Version: neue Clippy-Regeln späterer Versionen brechen die CI nicht unbemerkt
  RUST: 1.97.0

jobs:
  linux:
    name: Linux (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Werkzeuge
        run: |
          rustup toolchain install $RUST --profile minimal --component clippy,rustfmt
          rustup default $RUST
          cargo --version

      - name: Abhängigkeiten (C-Referenz, Testbilder)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev liblzma-dev python3-pil

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Formatierung
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --features cref

      - name: Testbilder erzeugen
        run: python3 tools/gen_testimages.py testbilder/png testbilder/jpg

      - name: Tests und Differenztests gegen die C-Referenz (bytegleich)
        env:
          GPK_PNG_DIR: ${{ github.workspace }}/testbilder/png
          GPK_JPEG_DIR: ${{ github.workspace }}/testbilder/jpg
        run: cargo test --release --features cref

      - name: Tests im Debug-Modus (Überlaufprüfungen aktiv)
        run: cargo test --lib

      - name: gpk bauen
        run: cargo build --release

      - name: GPK-Rauchtest (packen, entpacken, bitgenau vergleichen)
        run: python3 ci/smoke_test.py target/release/gpk

      - name: Deterministisch (1 vs. 4 Threads), Formatgleichheit mit der C-Version
        run: |
          make -C legacy-c/gpk gpk CFLAGS="-O2 -Wall -Wextra"
          python3 ci/smoke_test.py --make-tree baum
          target/release/gpk c -t 1 baum rust1.gpk
          target/release/gpk c -t 4 -b 1 baum rust4.gpk
          target/release/gpk c -t 4 baum rust.gpk
          cmp rust1.gpk rust.gpk && echo "Archive unabhängig von der Threadzahl"
          legacy-c/gpk/gpk c -t 3 baum c.gpk
          target/release/gpk x c.gpk aus-rust && diff -r baum aus-rust
          legacy-c/gpk/gpk x rust.gpk aus-c && diff -r baum aus-c
          legacy-c/gpk/gpk x rust4.gpk aus-c4 && diff -r baum aus-c4

      - name: Linux-Programm hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gpk-linux-x86_64
          path: target/release/gpk

  windows-exe:
    # Keine Windows-VM: Cross-Compiling mit MinGW-w64 und Test per Wine auf Ubuntu
    name: Windows-.exe (Cross-Build + Wine)
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wine
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Werkzeuge mit Windows-Ziel
        run: |
          rustup toolchain install $RUST --profile minimal --target x86_64-pc-windows-gnu
          rustup default $RUST

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: gpk.exe bauen (statisch, ohne DLL-Abhängigkeiten außer Windows-Systembibliotheken)
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/gpk.exe | grep "DLL Name"

      - name: Linux-gpk als Gegenstück bauen
        run: cargo build --release

      - name: Wine vorbereiten
        run: wineboot --init && wineserver -w

      - name: Unit-Tests unter Wine
        run: cargo test --release --target x86_64-pc-windows-gnu --lib

      - name: GPK-Rauchtest unter Wine
        run: python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine

      - name: Systemwechsel Linux -> Windows
        run: |
          python3 ci/smoke_test.py target/release/gpk --cross-pack linux.gpk
          python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine --cross-extract linux.gpk

      - name: Systemwechsel Windows -> Linux
        run: |
          python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine --cross-pack windows.gpk
          python3 ci/smoke_test.py target/release/gpk --cross-extract windows.gpk

      - name: gpk.exe hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gpk-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/gpk.exe

  release:
    name: Release-Dateien veröffentlichen
    # Nur für Tags und veröffentlichte Releases, und nur wenn alle Builds und Tests grün sind
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build-Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Release-Pakete schnüren
        run: |
          mkdir -p dist/gpk-$TAG-linux-x86_64 dist/gpk-$TAG-windows-x86_64
          install -m 755 artefakte/gpk-linux-x86_64/gpk dist/gpk-$TAG-linux-x86_64/gpk
          cp artefakte/gpk-windows-x86_64/gpk.exe dist/gpk-$TAG-windows-x86_64/
          for d in dist/gpk-$TAG-*; do cp README.md "$d/README.md"; cp docs/GPK.md "$d/GPK.md"; done
          cd dist
          tar -czf gpk-$TAG-linux-x86_64.tar.gz gpk-$TAG-linux-x86_64
          zip -qr gpk-$TAG-windows-x86_64.zip gpk-$TAG-windows-x86_64
          sha256sum gpk-$TAG-*.tar.gz gpk-$TAG-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release anlegen (falls nötig) und Dateien hochladen
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GPK $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/gpk-$TAG-linux-x86_64.tar.gz dist/gpk-$TAG-windows-x86_64.zip dist/SHA256SUMS.txt --clobber
