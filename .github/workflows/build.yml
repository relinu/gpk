name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']          # Tag v1.2.3 pushen -> Release mit Programmen
  pull_request:
  release:
    types: [published]    # in der GitHub-Oberfläche veröffentlichter Release -> Programme anhängen
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      # Portabel statt -march=native, damit die Programme auf jeder x86-64-CPU laufen
      CFLAGS: -O2 -Wall -Wextra
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev zlib1g-dev liblzma-dev libbz2-dev libzstd1 liblz4-1

      - name: GLZ und Benchmark bauen
        run: make CC=$CC CFLAGS="$CFLAGS"

      - name: GPK bauen
        run: make -C gpk CC=$CC CFLAGS="$CFLAGS"

      - name: Filter-Roundtrip-Fuzztest (ASan/UBSan)
        run: make -C gpk test CC=$CC

      - name: GLZ-Decoder-Fuzztest (ASan/UBSan)
        run: |
          $CC -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all fuzz.c glz.c -lm -o fuzz_asan
          ./fuzz_asan glz.c gpk/gpk.c gpk/lzrc.c /usr/lib/x86_64-linux-gnu/libz.so.1

      - name: GPK-Rauchtest (packen, entpacken, bitgenau vergleichen)
        run: python3 ci/smoke_test.py gpk/gpk

      - name: Linux-Programme hochladen
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: gpk-linux-x86_64
          path: |
            gpk/gpk
            bench

  windows-exe:
    # Keine Windows-VM: Cross-Compiling mit MinGW-w64 und Test per Wine auf Ubuntu
    name: Windows-.exe (Cross-Build + Wine)
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wine
    steps:
      - uses: actions/checkout@v4

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc zlib1g-dev liblzma-dev gcc-mingw-w64-x86-64 libz-mingw-w64-dev wine wine64

      - name: gpk.exe bauen (statisch, ohne DLL-Abhängigkeiten)
        run: |
          make -C gpk windows
          x86_64-w64-mingw32-objdump -p gpk/gpk.exe | grep "DLL Name"

      - name: Linux-gpk als Gegenstück bauen
        run: make -C gpk gpk

      - name: Wine vorbereiten
        run: wineboot --init && wineserver -w

      - name: Filter-Roundtrip-Test unter Wine
        run: |
          make -C gpk tests/filter_roundtrip.exe
          wine gpk/tests/filter_roundtrip.exe

      - name: GPK-Rauchtest unter Wine
        run: python3 ci/smoke_test.py gpk/gpk.exe --wine

      - name: Systemwechsel Linux -> Windows
        run: |
          python3 ci/smoke_test.py gpk/gpk --cross-pack linux.gpk
          python3 ci/smoke_test.py gpk/gpk.exe --wine --cross-extract linux.gpk

      - name: Systemwechsel Windows -> Linux
        run: |
          python3 ci/smoke_test.py gpk/gpk.exe --wine --cross-pack windows.gpk
          python3 ci/smoke_test.py gpk/gpk --cross-extract windows.gpk

      - name: gpk.exe hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gpk-windows-x86_64
          path: gpk/gpk.exe

  release:
    name: Release-Dateien veröffentlichen
    # Nur für Tags und veröffentlichte Releases, und nur wenn alle Builds und Tests grün sind
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build-Artefakte holen
        uses: actions/download-artifact@v4
        with:
          path: artefakte

      - name: Release-Pakete schnüren
        run: |
          mkdir -p dist/gpk-$TAG-linux-x86_64 dist/gpk-$TAG-windows-x86_64
          install -m 755 artefakte/gpk-linux-x86_64/gpk/gpk dist/gpk-$TAG-linux-x86_64/gpk
          cp artefakte/gpk-windows-x86_64/gpk.exe dist/gpk-$TAG-windows-x86_64/
          for d in dist/gpk-$TAG-*; do cp README.md "$d/README.md"; cp gpk/README.md "$d/GPK.md"; done
          cd dist
          tar -czf gpk-$TAG-linux-x86_64.tar.gz gpk-$TAG-linux-x86_64
          zip -qr gpk-$TAG-windows-x86_64.zip gpk-$TAG-windows-x86_64
          sha256sum gpk-$TAG-*.tar.gz gpk-$TAG-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release anlegen (falls nötig) und Dateien hochladen
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GPK $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/gpk-$TAG-linux-x86_64.tar.gz dist/gpk-$TAG-windows-x86_64.zip dist/SHA256SUMS.txt --clobber
