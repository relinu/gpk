name: Build & Test

on:
  push:
    branches: [main, rust-port]
    tags: ['v*']          # push tag v1.2.3 -> release with programs
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']   # documentation-only changes need no build
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  release:
    types: [published]    # release published in the GitHub UI -> attach programs
  workflow_dispatch:

# A new push to the same branch cancels the run that is still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned Rust version: new Clippy rules in later versions do not break CI unnoticed
  RUST: 1.97.0

jobs:
  linux:
    name: Linux (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install $RUST --profile minimal --component clippy,rustfmt
          rustup default $RUST
          cargo --version

      - name: Dependencies (C reference, test images)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends zlib1g-dev liblzma-dev python3-pil

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features cref,xz

      - name: Create test images
        run: python3 tools/gen_testimages.py testimages/png testimages/jpg

      - name: Tests and differential tests against the C reference and zlib (byte-identical)
        env:
          GPK_PNG_DIR: ${{ github.workspace }}/testimages/png
          GPK_JPEG_DIR: ${{ github.workspace }}/testimages/jpg
        run: cargo test --release --features cref,xz

      - name: Tests in debug mode (overflow checks enabled)
        run: cargo test --lib

      - name: Build gpk
        run: |
          cargo build --release
          # Default build: no C code, the only dependency is crc32fast (+ cfg-if)
          test "$(cargo tree -e normal --prefix none | sort -u | cut -d' ' -f1 | tr '\n' ' ')" = "cfg-if crc32fast gpk "

      - name: GPK smoke test (pack, unpack, compare bit-exactly)
        run: python3 ci/smoke_test.py target/release/gpk

      - name: Deterministic (1 vs. 4 threads), same format as the C version
        run: |
          make -C legacy-c/gpk gpk CFLAGS="-O2 -Wall -Wextra"
          python3 ci/smoke_test.py --make-tree tree
          target/release/gpk c -t 1 tree rust1.gpk
          target/release/gpk c -t 4 -b 1 tree rust4.gpk
          target/release/gpk c -t 4 tree rust.gpk
          cmp rust1.gpk rust.gpk && echo "archives independent of the thread count"
          legacy-c/gpk/gpk c -t 3 tree c.gpk
          target/release/gpk x c.gpk out-rust && diff -r tree out-rust
          legacy-c/gpk/gpk x rust.gpk out-c && diff -r tree out-c
          legacy-c/gpk/gpk x rust4.gpk out-c4 && diff -r tree out-c4

      - name: Optional xz core (--features xz)
        run: |
          cargo build --release --features xz --target-dir target-xz
          target-xz/release/gpk c --xz -t 2 tree xz.gpk
          target-xz/release/gpk x xz.gpk out-xz && diff -r tree out-xz
          if target/release/gpk x xz.gpk out-noxz 2>error.txt; then exit 1; fi
          grep -q "built without xz" error.txt

      - name: Upload Linux program
        uses: actions/upload-artifact@v4
        with:
          name: gpk-linux-x86_64
          path: target/release/gpk

  windows-exe:
    # No Windows VM: cross-compiling with MinGW-w64 and testing with Wine on Ubuntu
    name: Windows-.exe (Cross-Build + Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wine
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain with Windows target
        run: |
          rustup toolchain install $RUST --profile minimal --target x86_64-pc-windows-gnu
          rustup default $RUST

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          # Without recommended packages (fonts, multimedia, 32-bit parts): far fewer downloads.
          # A hanging mirror aborts after 5 minutes instead of blocking the job for hours.
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64 wine wine64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Build gpk.exe (static, no DLL dependencies except Windows system libraries)
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/gpk.exe | grep "DLL Name"

      - name: Build the Linux gpk as counterpart
        run: cargo build --release

      - name: Prepare Wine
        run: wineboot --init && wineserver -w

      - name: Unit tests under Wine
        run: cargo test --release --target x86_64-pc-windows-gnu --lib

      - name: GPK smoke test under Wine
        run: python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine

      - name: Cross-platform Linux -> Windows
        run: |
          python3 ci/smoke_test.py target/release/gpk --cross-pack linux.gpk
          python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine --cross-extract linux.gpk

      - name: Cross-platform Windows -> Linux
        run: |
          python3 ci/smoke_test.py target/x86_64-pc-windows-gnu/release/gpk.exe --wine --cross-pack windows.gpk
          python3 ci/smoke_test.py target/release/gpk --cross-extract windows.gpk

      - name: Upload gpk.exe
        uses: actions/upload-artifact@v4
        with:
          name: gpk-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/gpk.exe

  release:
    name: Publish release files
    # Only for tags and published releases, and only if all builds and tests are green
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release packages
        run: |
          mkdir -p dist/gpk-$TAG-linux-x86_64 dist/gpk-$TAG-windows-x86_64
          install -m 755 artifacts/gpk-linux-x86_64/gpk dist/gpk-$TAG-linux-x86_64/gpk
          cp artifacts/gpk-windows-x86_64/gpk.exe dist/gpk-$TAG-windows-x86_64/
          for d in dist/gpk-$TAG-*; do cp README.md "$d/README.md"; cp docs/GPK.md "$d/GPK.md"; done
          cd dist
          tar -czf gpk-$TAG-linux-x86_64.tar.gz gpk-$TAG-linux-x86_64
          zip -qr gpk-$TAG-windows-x86_64.zip gpk-$TAG-windows-x86_64
          sha256sum gpk-$TAG-*.tar.gz gpk-$TAG-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release (if needed) and upload the files
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GPK $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/gpk-$TAG-linux-x86_64.tar.gz dist/gpk-$TAG-windows-x86_64.zip dist/SHA256SUMS.txt --clobber
