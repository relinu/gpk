[package]
name = "gpk"
version = "0.4.0"
edition = "2021"
description = "Download-Packer für Spiel-Builds (verlustfrei, bitgenau, parallel)"
publish = false

[lib]
name = "gpk"
path = "src/lib.rs"

[[bin]]
name = "gpk"
path = "src/main.rs"

[dependencies]
# Echte zlib (statisch gebaut): nötig, um zlib-erzeugte PNG-Deflate-Ströme bitgenau neu zu erzeugen
libz-sys = { version = "1", default-features = false, features = ["static"] }
libc = "0.2"
crc32fast = "1"
memmap2 = "0.9"
# Optionaler xz-Kern (--xz) über liblzma, statisch gebaut
xz2 = { version = "0.1", features = ["static"], optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = ["xz"]
xz = ["dep:xz2"]
# C-Referenzimplementierung (legacy-c/) für Differenztests mitkompilieren
cref = ["dep:cc"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
