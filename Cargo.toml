[package]
name = "gpk"
version = "0.4.0"
edition = "2021"
description = "Download-Packer für Spiel-Builds (verlustfrei, bitgenau, parallel)"
publish = false

[lib]
name = "gpk"
path = "src/lib.rs"

[[bin]]
name = "gpk"
path = "src/main.rs"

# Messwerkzeuge (Rust gegen C-Referenz): cargo run --release --features cref --example prof -- <build>
[[example]]
name = "prof"
required-features = ["cref"]

[[example]]
name = "tcmbench"
required-features = ["cref"]

[[example]]
name = "zbench"
required-features = ["cref"]

[dependencies]
# CRC32 (reines Rust, nutzt die CPU-Befehle für Carry-less-Multiplikation; ~6x schneller als
# jede sichere Eigenimplementierung)
crc32fast = "1"
# Optional: xz/LZMA2 als Vergleichskern (--xz) über liblzma (C). Nicht im Standard-Build:
# der eigene Kern LZRC packt kleiner und schneller.
xz2 = { version = "0.1", features = ["static"], optional = true }
# Nur für die Differenztests gegen die C-Referenz und die echte zlib (Feature `cref`)
libz-sys = { version = "1", default-features = false, features = ["static"], optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
xz = ["dep:xz2"]
# C-Referenzimplementierung (legacy-c/) und echte zlib für Differenztests mitkompilieren
cref = ["dep:cc", "dep:libz-sys", "dep:libc"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
