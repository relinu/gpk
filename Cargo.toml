[package]
name = "gpk"
version = "0.4.0"
edition = "2021"
description = "Download packer for game builds (lossless, bit-exact, parallel)"
publish = false

[lib]
name = "gpk"
path = "src/lib.rs"

[[bin]]
name = "gpk"
path = "src/main.rs"

# Measurement tools (Rust vs. C reference): cargo run --release --features cref --example prof -- <build>
[[example]]
name = "prof"
required-features = ["cref"]

[[example]]
name = "tcmbench"
required-features = ["cref"]

[[example]]
name = "zbench"
required-features = ["cref"]

[dependencies]
# CRC32 (pure Rust, uses the CPU's carry-less multiplication instructions; ~6x faster than
# any safe own implementation)
crc32fast = "1"
# Optional: xz/LZMA2 as a comparison core (--xz) via liblzma (C). Not in the default build:
# the own core LZRC packs smaller and faster.
xz2 = { version = "0.1", features = ["static"], optional = true }
# Only for the differential tests against the C reference and the real zlib (feature `cref`)
libz-sys = { version = "1", default-features = false, features = ["static"], optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
xz = ["dep:xz2"]
# Compile the C reference implementation (legacy-c/) and the real zlib for differential tests

cref = ["dep:cc", "dep:libz-sys", "dep:libc"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

# Optimized but fast to compile: used by CI for the test runs (release artifacts use `release`)
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
